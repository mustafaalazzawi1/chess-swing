name: Bug report
description: Report a reproducible problem in Chess Swing.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve Chess Swing. Please avoid sharing private files or personal information in screenshots.
  - type: input
    id: version
    attributes:
      label: App version
      description: Version shown beside the Chess Swing heading.
      placeholder: v1.2.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Java version
      placeholder: macOS, Java 21
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include game mode and moves, or a minimal PGN when relevant.
      placeholder: |
        1. Start a new game...
        2. Play...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or error messages
      description: Optional. App-only screenshots are preferred.
