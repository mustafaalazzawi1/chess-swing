name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Optional source tag or commit to verify
        type: string

permissions:
  contents: read

jobs:
  java:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SOURCE_REF: ${{ inputs.source_ref || github.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.SOURCE_REF }}
          persist-credentials: false
      - name: Identify tested source
        run: git rev-parse HEAD
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.11'
      - name: Verify Temurin build
        run: java -version 2>&1 | tee /dev/stderr | grep -F 'Temurin-21.0.11+10'
      - run: ./build.sh --test
      - name: Exercise the packaged JAR
        shell: bash
        run: ./scripts/smoke-jar.sh
      - name: Check window layouts on a virtual display
        run: xvfb-run -a java -cp build/classes:build/test-classes oopchesscode.game.ChessWindowLayoutTest
