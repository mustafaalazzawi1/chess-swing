name: Package Chess Swing v1.2.0

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RELEASE_COMMIT: b1de0bcfb40f5b52d1ed730b6430cd4969424dd5
      REVIEWED_JAR_SHA256: a3b5fefa8f41978e8d31b4b92c5d8bea65149391494c9392cc71f263e5d6f723
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: b1de0bcfb40f5b52d1ed730b6430cd4969424dd5
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21.0.11'
      - name: Verify source, build from the ZIP, and checksum the assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          java -version 2>&1 | tee /dev/stderr | grep -F 'Temurin-21.0.11+10'
          expected_tree="$(git rev-parse 'HEAD^{tree}')"
          output="$RUNNER_TEMP/chess-release-assets"
          extracted="$RUNNER_TEMP/chess-release-extract"
          mkdir "$output" "$extracted"
          git archive --format=zip --prefix=chess-swing-v1.2.0-source/ \
            -o "$output/chess-swing-v1.2.0-source.zip" "$RELEASE_COMMIT"
          unzip -tq "$output/chess-swing-v1.2.0-source.zip"
          unzip -q "$output/chess-swing-v1.2.0-source.zip" -d "$extracted"
          cd "$extracted/chess-swing-v1.2.0-source"
          git init -q
          git -c core.filemode=true add -f -- .
          test "$(git write-tree)" = "$expected_tree"
          printf 'Verified tagged source tree %s\n' "$expected_tree"
          test "$(cat VERSION)" = 1.2.0
          test -s lib/FLATLAF-LICENSE.txt
          test -s lib/flatlaf-3.6.2.jar
          ./build.sh --test
          ./scripts/smoke-jar.sh
          cp build/chess-swing.jar "$output/chess-swing-v1.2.0.jar"
          cd "$output"
          printf '%s  %s\n' "$REVIEWED_JAR_SHA256" chess-swing-v1.2.0.jar | sha256sum -c -
          sha256sum chess-swing-v1.2.0.jar chess-swing-v1.2.0-source.zip > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chess-swing-v1.2.0-release-assets
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/chess-release-assets/chess-swing-v1.2.0.jar
            ${{ runner.temp }}/chess-release-assets/chess-swing-v1.2.0-source.zip
            ${{ runner.temp }}/chess-release-assets/SHA256SUMS.txt
